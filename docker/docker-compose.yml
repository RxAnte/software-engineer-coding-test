services:
  api:
    container_name: software-engineering-coding-test_api
    image: software-engineering-coding-test_api
    environment:
      - HOSTNAME=software-engineering-coding-test_api
    volumes:
      - ../api:/var/www:delegated
    ports:
      - "55781:80"

  web:
    container_name: software-engineering-coding-test_web
    image: software-engineering-coding-test_web
    working_dir: /app
    environment:
      - HOSTNAME=software-engineering-coding-test_web
    command:
      - "node_modules/.bin/next"
      - "dev"
      - "-p"
      - "80"
    expose:
      - 80
    volumes:
      - ../web:/app:delegated
    ports:
      - "55782:80"
